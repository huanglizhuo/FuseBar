name: FuseBar
options:
  developmentLanguage: en
  knownRegions: [en, zh-Hans, ja, fr, es]
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_IDENTITY: Apple Development
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: N9Q47Y2LQ4
    ENABLE_HARDENED_RUNTIME: YES
targets:
  FuseBar:
    type: application
    platform: macOS
    sources:
      - path: Sources/FuseBar
        excludes: [AppIcon.icon, Assets.xcassets, FuseBar.entitlements]
      - path: Sources/FuseBar/AppIcon.icon
        type: file
        buildPhase: resources
        explicitFileType: folder.iconcomposer.icon
      - path: Sources/FuseBar/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clothpath.fusebar
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Sources/FuseBar/FuseBar.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: 'FuseBar shows paired Bluetooth devices and connects or disconnects them when you choose. Device names and status stay on your Mac.'
        INFOPLIST_KEY_NSLocationUsageDescription: 'FuseBar uses location permission to show your connected Wi-Fi name and list nearby networks when you open the Wi-Fi panel. Access is optional. FuseBar does not read your geographic location or upload network names.'
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 'FuseBar uses location permission to show your connected Wi-Fi name and list nearby networks when you open the Wi-Fi panel. Access is optional. FuseBar does not read your geographic location or upload network names.'
        MARKETING_VERSION: '1.4.1'
        CURRENT_PROJECT_VERSION: '10'
  FuseBarTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/FuseBarTests]
    dependencies:
      - target: FuseBar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.clothpath.fusebar.tests
schemes:
  FuseBar:
    build:
      targets:
        FuseBar: all
    test:
      targets: [FuseBarTests]
