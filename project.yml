name: FuseBar
options:
  developmentLanguage: en
  knownRegions: [en, zh-Hans, ja, fr, es]
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    CODE_SIGN_IDENTITY: Apple Development
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: N9Q47Y2LQ4
    ENABLE_HARDENED_RUNTIME: YES
targets:
  FuseBar:
    type: application
    platform: macOS
    sources:
      - path: Sources/FuseBar
        excludes: [AppIcon.icon, FuseBar.entitlements]
      - path: Sources/FuseBar/AppIcon.icon
        type: file
        buildPhase: resources
        explicitFileType: folder.iconcomposer.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clothpath.mergebar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Sources/FuseBar/FuseBar.entitlements
        ENABLE_APP_SANDBOX: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: 'FuseBar reads Bluetooth power and paired-device connection status locally.'
        INFOPLIST_KEY_NSLocationUsageDescription: 'macOS requires location permission to read Wi-Fi names and scan nearby networks on request. FuseBar does not collect location or upload network names.'
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 'macOS requires location permission to read Wi-Fi names and scan nearby networks on request. FuseBar does not collect location or upload network names.'
        MARKETING_VERSION: '1.1.0'
        CURRENT_PROJECT_VERSION: '3'
  FuseBarTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/FuseBarTests]
    dependencies:
      - target: FuseBar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.clothpath.mergebar.tests
schemes:
  FuseBar:
    build:
      targets:
        FuseBar: all
    test:
      targets: [FuseBarTests]
